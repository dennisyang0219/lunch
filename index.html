<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂便當系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-group">
        <span class="logo-icon">🍱</span>
        <div>
          <h1>中午吃什麼？</h1>
          <p style="font-size: 0.8rem; color: var(--text-secondary);">團購便當點餐系統</p>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" id="btn-go-admin">⚙️ 管理者後台</button>
    </header>

    <!-- API Warning -->
    <div id="api-warning" class="status-msg info" style="display: none;">
      
    </div>

    <!-- Timer Banner -->
    <div class="timer-banner" id="timer-container" style="display: none;">
      <div class="timer-title">
        <span>🕒</span>
        <span id="timer-status-text">點餐截止倒數：</span>
      </div>
      <div class="timer-countdown" id="countdown">--:--:--</div>
    </div>

    <div id="main-content">
      <!-- Order Form -->
      <section class="card" id="order-form-card">
        <h2 class="card-title"><span>✍️</span> 我要點餐</h2>
        
        <div id="submit-status" class="status-msg"></div>

        <form id="order-form">
          <div class="form-group">
            <label for="user-department">🏢 您的單位</label>
            <select id="user-department" required>
              <option value="" disabled selected>請選擇單位</option>
              <option value="資訊處">資訊處</option>
              <option value="工安環保處">工安環保處</option>
              <option value="水質處">水質處</option>
              <option value="供水處">供水處</option>
              <option value="漏水防治處">漏水防治處</option>
              <option value="採購供應處">採購供應處</option>
              <option value="人力資源處">人力資源處</option>
              <option value="財務處">財務處</option>
              <option value="會計處">會計處</option>
              <option value="檢核室">檢核室</option>
              <option value="宏碁">宏碁</option>
              <option value="資拓">資拓</option>
              <option value="易捷">易捷</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="form-group">
            <label for="user-name">👤 您的姓名</label>
            <input type="text" id="user-name" required placeholder="請輸入姓名">
            <div id="duplicate-warning-tip" class="duplicate-tip" style="display: none;">
              <span>ℹ️</span> <span id="duplicate-warning-text">偵測到您先前已有點餐紀錄...</span>
            </div>
          </div>

          <div class="form-group">
            <label for="store-select">🏪 選擇便當店</label>
            <select id="store-select" required>
              <option value="" disabled selected>載入中...</option>
            </select>
          </div>
          
          <div id="store-info-display" style="display: none; background: rgba(2, 132, 199, 0.04); border: 1px solid rgba(2, 132, 199, 0.15); border-radius: 8px; padding: 0.75rem 1rem; margin-top: -0.75rem; margin-bottom: 1.5rem; font-size: 0.85rem; line-height: 1.5; color: var(--text-secondary);">
            <!-- Store info details populated dynamically -->
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
              <label style="margin-bottom: 0;">🍱 選擇便當品項 (可多選)</label>
              <div id="menu-search-wrapper" style="display: none; width: 100%; max-width: 220px;">
                <input type="text" id="menu-search-input" placeholder="🔍 搜尋菜色 (如: 排骨)" style="padding: 0.35rem 0.65rem; font-size: 0.82rem; border-radius: 6px; border: 1px solid rgba(14, 165, 233, 0.25); background: rgba(15, 23, 42, 0.6); color: var(--text-primary); width: 100%;">
              </div>
            </div>
            <div class="menu-options-list" id="menu-items-container">
              <div class="empty-menu-placeholder">請先選擇便當店</div>
            </div>
          </div>

          <div id="order-subtotal-card" class="order-subtotal-badge" style="display: none;">
            <div class="subtotal-info">
              <span>🛒 目前點餐小計：</span>
              <span id="subtotal-item-count" class="badge-count">0 份便當</span>
            </div>
            <div class="subtotal-price" id="subtotal-total-price">$0</div>
          </div>

          <button type="submit" class="btn" style="width: 100%;" id="btn-submit">
            <span>🚀</span> 送出訂單
          </button>
        </form>
      </section>

      <!-- Stats Panel -->
      <section class="card">
        <h2 class="card-title"><span>📊</span> 目前訂單統計看板</h2>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
          <p style="font-size: 0.9rem; color: var(--text-secondary);">大家點了些什麼？看這裡跟著點就對了！</p>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-secondary btn-sm" id="btn-export-csv">📥 匯出 CSV</button>
            <button class="btn btn-secondary btn-sm" id="btn-open-copy-modal">📋 複製訂餐統計</button>
            <button class="btn btn-secondary btn-sm" id="btn-refresh-stats">🔄 重新整理</button>
          </div>
        </div>

        <div class="stats-grid" id="stats-summary">
          <!-- Stats count will be inserted here -->
        </div>

        <div class="table-responsive" style="margin-top: 1.5rem;">
          <table>
            <thead>
              <tr>
                <th>單位</th>
                <th>姓名</th>
                <th>點餐品項</th>
                <th>價格</th>
                <th>點餐時間</th>
              </tr>
            </thead>
            <tbody id="orders-list-body">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-muted);">載入訂單中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal-overlay" id="password-modal">
    <div class="modal">
      <h3 class="modal-header">🔒 管理員驗證</h3>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">請輸入後台管理密碼：</p>
      
      <div class="form-group">
        <input type="password" id="admin-password" placeholder="請輸入密碼" style="width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: var(--text-primary);">
        <p id="password-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem; display: none;">密碼錯誤，請再試一次</p>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="btn-close-modal">取消</button>
        <button class="btn btn-sm" id="btn-submit-password">登入</button>
      </div>
    </div>
  </div>

  <!-- Overwrite Confirmation Modal -->
  <div class="modal-overlay" id="overwrite-confirm-modal">
    <div class="modal" style="text-align: center; max-width: 420px;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⚠️</div>
      <h3 class="modal-header" style="justify-content: center; margin-bottom: 0.5rem;">偵測到重複訂餐</h3>
      <p style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 0.75rem;" id="overwrite-modal-desc">
        您先前已有訂餐紀錄。
      </p>
      <p style="font-size: 0.85rem; color: #b45309; background: rgba(245, 158, 11, 0.12); padding: 0.6rem; border-radius: 6px; margin-bottom: 1.5rem; border: 1px solid rgba(245, 158, 11, 0.25);">
        ⚠️ 選擇「覆蓋原本訂單」將會以您本次勾選的餐點取代原本的紀錄。
      </p>
      <div class="modal-actions" style="justify-content: center; gap: 0.75rem;">
        <button class="btn btn-secondary btn-sm" id="btn-cancel-overwrite">取消</button>
        <button class="btn btn-danger btn-sm" id="btn-confirm-overwrite">🔄 確認覆蓋原本訂單</button>
      </div>
    </div>
  </div>

  <!-- Copy Summary Modal -->
  <div class="modal-overlay" id="copy-summary-modal">
    <div class="modal" style="max-width: 520px;">
      <h3 class="modal-header">📋 一鍵複製訂餐統計</h3>
      
      <div class="tab-group">
        <button type="button" class="tab-btn active" id="tab-copy-store">📞 給店家 (電話訂餐數)</button>
        <button type="button" class="tab-btn" id="tab-copy-line">💬 給同仁 (LINE 對帳明細)</button>
      </div>

      <div class="form-group">
        <textarea id="copy-text-area" rows="10" readonly style="width: 100%; font-family: monospace; font-size: 0.85rem; padding: 0.75rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; resize: none; color: var(--text-primary);"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="btn-close-copy-modal">關閉</button>
        <button class="btn btn-sm" id="btn-do-copy">📋 複製文字至剪貼簿</button>
      </div>
    </div>
  </div>

  <!-- Success Order Modal -->
  <div class="modal-overlay" id="order-success-modal">
    <div class="modal" style="text-align: center;">
      <h3 class="modal-header" style="font-size: 1.5rem; margin-bottom: 0.75rem;">🎉 訂購成功</h3>
      <p style="font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.5;">您已經訂餐，請盡速繳費，謝謝</p>
      <div class="modal-actions" style="justify-content: center; margin-top: 0;">
        <button class="btn" id="btn-close-success-modal" style="width: 100%; max-width: 120px;">確定</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-notification" class="toast" style="display: none;">已複製到剪貼簿！</div>

  <script>
    // Config
    const API_KEY_STORAGE = 'lunchbox_api_url';
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwmWXwO3tljR_gReHpeMksv2vyxgk97_F3sl7HDL1A8T1ji1CwGpoXUps-KMIWKIsIXgA/exec'; // 填入固定 API 網址即可免設定直接使用！
    let apiUrl = DEFAULT_API_URL.trim() || localStorage.getItem(API_KEY_STORAGE) || '';
    let menuData = [];
    let storesData = []; // store details (address, phone, remarks)
    let ordersData = [];
    let deadlineTime = null;
    let timerInterval = null;
    let activeStoreConfig = null; // Locked active store from config

    // Elements
    const btnGoAdmin = document.getElementById('btn-go-admin');
    const passwordModal = document.getElementById('password-modal');
    const adminPasswordInput = document.getElementById('admin-password');
    const btnSubmitPassword = document.getElementById('btn-submit-password');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const passwordError = document.getElementById('password-error');
    
    const apiWarning = document.getElementById('api-warning');
    const userDepartmentSelect = document.getElementById('user-department');
    const userNameInput = document.getElementById('user-name');
    const storeSelect = document.getElementById('store-select');
    const menuItemsContainer = document.getElementById('menu-items-container');
    const orderForm = document.getElementById('order-form');
    const btnSubmit = document.getElementById('btn-submit');
    const submitStatus = document.getElementById('submit-status');
    const btnRefreshStats = document.getElementById('btn-refresh-stats');
    
    const statsSummary = document.getElementById('stats-summary');
    const ordersListBody = document.getElementById('orders-list-body');
    const timerContainer = document.getElementById('timer-container');
    const countdownEl = document.getElementById('countdown');
    const timerStatusText = document.getElementById('timer-status-text');
    const orderSuccessModal = document.getElementById('order-success-modal');
    const btnCloseSuccessModal = document.getElementById('btn-close-success-modal');

    // Duplicate warning & Overwrite elements
    const duplicateWarningTip = document.getElementById('duplicate-warning-tip');
    const duplicateWarningText = document.getElementById('duplicate-warning-text');
    const overwriteConfirmModal = document.getElementById('overwrite-confirm-modal');
    const overwriteModalDesc = document.getElementById('overwrite-modal-desc');
    const btnCancelOverwrite = document.getElementById('btn-cancel-overwrite');
    const btnConfirmOverwrite = document.getElementById('btn-confirm-overwrite');
    let isConfirmedOverwrite = false;

    // Subtotal badge elements
    const orderSubtotalCard = document.getElementById('order-subtotal-card');
    const subtotalItemCount = document.getElementById('subtotal-item-count');
    const subtotalTotalPrice = document.getElementById('subtotal-total-price');

    // Copy Summary elements
    const btnOpenCopyModal = document.getElementById('btn-open-copy-modal');
    const copySummaryModal = document.getElementById('copy-summary-modal');
    const tabCopyStore = document.getElementById('tab-copy-store');
    const tabCopyLine = document.getElementById('tab-copy-line');
    const copyTextArea = document.getElementById('copy-text-area');
    const btnCloseCopyModal = document.getElementById('btn-close-copy-modal');
    const btnDoCopy = document.getElementById('btn-do-copy');
    const toastNotification = document.getElementById('toast-notification');
    let currentCopyTab = 'store';

    // Page Init
    window.addEventListener('DOMContentLoaded', () => {
      // Check query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const apiParam = urlParams.get('api');
      if (apiParam) {
        localStorage.setItem(API_KEY_STORAGE, apiParam);
        apiUrl = apiParam;
      }
      if (apiParam && window.history.replaceState) {
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      // Auto-load saved Name & Department from localStorage if available
      const savedName = localStorage.getItem('lunchbox_user_name');
      const savedDept = localStorage.getItem('lunchbox_user_dept');
      if (savedDept) userDepartmentSelect.value = savedDept;
      if (savedName) userNameInput.value = savedName;
      
      // Check API URL
      if (!apiUrl) {
        apiWarning.style.display = 'block';
        storeSelect.innerHTML = '<option value="" disabled selected>請先設定 API URL</option>';
        ordersListBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">尚未設定 API</td></tr>';
        return;
      }

      fetchData();
    });

    // Refresh data
    btnRefreshStats.addEventListener('click', () => {
      if (!apiUrl) return;
      btnRefreshStats.classList.add('btn-disabled');
      btnRefreshStats.innerHTML = '<span class="spinner"></span> 重新整理中...';
      fetchData().finally(() => {
        btnRefreshStats.classList.remove('btn-disabled');
        btnRefreshStats.innerHTML = '🔄 重新整理';
      });
    });

    // Subtotal Calculation & Row Highlight
    function updateSubtotal() {
      let totalCount = 0;
      let totalPrice = 0;

      document.querySelectorAll('.menu-item-selection-row').forEach(row => {
        const cb = row.querySelector('input[name="lunchbox-item"]');
        if (cb && cb.checked) {
          row.classList.add('is-selected');
          const qtyInput = row.querySelector('.qty-input');
          const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;
          const price = parseFloat(cb.getAttribute('data-price')) || 0;
          totalCount += qty;
          totalPrice += (price * qty);
        } else {
          row.classList.remove('is-selected');
        }
      });

      if (totalCount > 0) {
        subtotalItemCount.innerText = `${totalCount} 份便當`;
        subtotalTotalPrice.innerText = `$${totalPrice}`;
        orderSubtotalCard.style.display = 'flex';
      } else {
        orderSubtotalCard.style.display = 'none';
      }
    }

    // Duplicate Order Checking
    function getExistingOrderForUser(name) {
      if (!name || !activeStoreConfig) return null;
      const userOrders = ordersData.filter(ord => 
        ord.store === activeStoreConfig && 
        ord.name.trim().toLowerCase() === name.trim().toLowerCase()
      );
      if (userOrders.length === 0) return null;

      const itemCounts = {};
      userOrders.forEach(ord => {
        const qty = ord.quantity ? parseInt(ord.quantity) || 1 : 1;
        itemCounts[ord.item] = (itemCounts[ord.item] || 0) + qty;
      });

      const summaryStr = Object.entries(itemCounts)
        .map(([item, count]) => count > 1 ? `${item} x${count}` : item)
        .join('、');

      return {
        orders: userOrders,
        summaryText: summaryStr
      };
    }

    function checkDuplicateUserOrder() {
      const name = userNameInput.value.trim();
      const existing = getExistingOrderForUser(name);

      if (existing) {
        duplicateWarningText.innerText = `偵測到「${name}」在本次店家已有訂餐紀錄（已點：${existing.summaryText}）。送出將會「覆蓋」原紀錄。`;
        duplicateWarningTip.style.display = 'flex';
      } else {
        duplicateWarningTip.style.display = 'none';
      }
    }

    userNameInput.addEventListener('input', checkDuplicateUserOrder);

    // Overwrite Confirm Modal Listeners
    btnConfirmOverwrite.addEventListener('click', () => {
      isConfirmedOverwrite = true;
      overwriteConfirmModal.classList.remove('active');
      btnSubmit.click();
    });

    btnCancelOverwrite.addEventListener('click', () => {
      isConfirmedOverwrite = false;
      overwriteConfirmModal.classList.remove('active');
    });

    // Copy Summary Modal Listeners
    btnOpenCopyModal.addEventListener('click', () => {
      copySummaryModal.classList.add('active');
      updateCopyTextContent();
    });

    btnCloseCopyModal.addEventListener('click', () => {
      copySummaryModal.classList.remove('active');
    });

    tabCopyStore.addEventListener('click', () => {
      tabCopyStore.classList.add('active');
      tabCopyLine.classList.remove('active');
      currentCopyTab = 'store';
      updateCopyTextContent();
    });

    tabCopyLine.addEventListener('click', () => {
      tabCopyLine.classList.add('active');
      tabCopyStore.classList.remove('active');
      currentCopyTab = 'line';
      updateCopyTextContent();
    });

    function updateCopyTextContent() {
      const storeName = activeStoreConfig || '未指定店家';
      const filteredOrders = ordersData.filter(ord => ord.store === activeStoreConfig);
      const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });

      if (currentCopyTab === 'store') {
        const itemCounts = {};
        let totalQty = 0;
        let totalPrice = 0;

        filteredOrders.forEach(ord => {
          const qty = ord.quantity ? parseInt(ord.quantity) || 1 : 1;
          const price = parseFloat(ord.price) || 0;
          if (!itemCounts[ord.item]) {
            itemCounts[ord.item] = { count: 0, total: 0 };
          }
          itemCounts[ord.item].count += qty;
          itemCounts[ord.item].total += (price * qty);
          totalQty += qty;
          totalPrice += (price * qty);
        });

        let text = `🍱 訂餐統計匯總【${storeName}】\n`;
        text += `📅 統計時間：${nowStr}\n`;
        text += `-----------------------\n`;
        
        const items = Object.entries(itemCounts).sort((a, b) => b[1].count - a[1].count);
        if (items.length === 0) {
          text += `目前無點餐紀錄\n`;
        } else {
          items.forEach(([itemName, info], idx) => {
            text += `${idx + 1}. ${itemName} x ${info.count} 份 ($${info.total})\n`;
          });
        }
        text += `-----------------------\n`;
        text += `總計：${totalQty} 份便當 / 共 $${totalPrice} 元`;
        copyTextArea.value = text;
      } else {
        const userOrders = {};
        let totalQty = 0;
        let totalPrice = 0;

        filteredOrders.forEach(ord => {
          const qty = ord.quantity ? parseInt(ord.quantity) || 1 : 1;
          const price = parseFloat(ord.price) || 0;
          const key = `${ord.department || '無'}_${ord.name}`;

          if (!userOrders[key]) {
            userOrders[key] = {
              department: ord.department || '無',
              name: ord.name,
              items: {},
              userTotal: 0
            };
          }
          userOrders[key].items[ord.item] = (userOrders[key].items[ord.item] || 0) + qty;
          userOrders[key].userTotal += (price * qty);
          totalQty += qty;
          totalPrice += (price * qty);
        });

        let text = `📋 訂餐明細對帳表【${storeName}】\n`;
        text += `📅 統計時間：${nowStr}\n`;
        text += `-----------------------\n`;
        
        const list = Object.values(userOrders);
        if (list.length === 0) {
          text += `目前無點餐紀錄\n`;
        } else {
          list.forEach(u => {
            const itemStrs = Object.entries(u.items).map(([it, q]) => q > 1 ? `${it} x${q}` : it).join('、');
            text += `• [${u.department}] ${u.name}：${itemStrs} ($${u.userTotal})\n`;
          });
        }
        text += `-----------------------\n`;
        text += `總計：${totalQty} 份便當 / 共 $${totalPrice} 元`;
        copyTextArea.value = text;
      }
    }

    btnDoCopy.addEventListener('click', () => {
      copyTextArea.select();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(copyTextArea.value).then(() => showToast('📋 已複製訂餐統計至剪貼簿！')).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    });

    function fallbackCopy() {
      try {
        document.execCommand('copy');
        showToast('📋 已複製訂餐統計至剪貼簿！');
      } catch (err) {
        alert('複製失敗，請手動全選複製');
      }
    }

    function showToast(msg) {
      toastNotification.innerText = msg;
      toastNotification.style.display = 'block';
      setTimeout(() => {
        toastNotification.style.display = 'none';
      }, 2500);
    }

    // CSV Export Utility Function
    function exportToCSV(filename, rows) {
      const processRow = function (row) {
        let finalVal = '';
        for (let j = 0; j < row.length; j++) {
          let innerValue = row[j] === null || row[j] === undefined ? '' : row[j].toString();
          let result = innerValue.replace(/"/g, '""');
          if (result.search(/("|,|\n)/g) >= 0)
            result = '"' + result + '"';
          if (j > 0)
            finalVal += ',';
          finalVal += result;
        }
        return finalVal + '\n';
      };

      let csvContent = '\uFEFF'; // UTF-8 BOM for Excel Chinese compatibility
      for (let i = 0; i < rows.length; i++) {
        csvContent += processRow(rows[i]);
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      if (link.download !== undefined) {
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // Export CSV Listener in Index
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      const filteredOrders = ordersData.filter(ord => ord.store === activeStoreConfig);
      if (filteredOrders.length === 0) {
        alert('目前尚無點餐資料可匯出！');
        return;
      }

      let paymentRecords = {};
      try {
        const raw = localStorage.getItem('lunchbox_admin_payment_status');
        if (raw) paymentRecords = JSON.parse(raw);
      } catch (e) {}

      // Sort filteredOrders by Bento Item (品項) primary, then Person Name (姓名) secondary for easy bento distribution
      filteredOrders.sort((a, b) => {
        const itemComp = (a.item || '').localeCompare(b.item || '', 'zh-Hant');
        if (itemComp !== 0) return itemComp;
        return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
      });

      const rows = [["點餐時間", "單位", "姓名", "店家", "品項", "價格", "繳費狀態"]];
      filteredOrders.forEach(ord => {
        let dStr = ord.timestamp ? new Date(ord.timestamp).toLocaleString('zh-TW') : '';
        let payStatus = '未給';
        const rec = paymentRecords[`${ord.department || '無'}_${ord.name}`];
        if (rec) {
          if (rec.status === '已給' || rec.status === '給') payStatus = '已給';
          else if (rec.status === '找錢') payStatus = rec.changeAmount ? `找錢 (找$${rec.changeAmount})` : '找錢';
        }
        rows.push([dStr, ord.department || '', ord.name, ord.store, ord.item, ord.price, payStatus]);
      });

      const todayDate = new Date().toISOString().slice(0, 10);
      exportToCSV(`便當點餐明細_${activeStoreConfig || '今日'}_${todayDate}.csv`, rows);
    });

    // Password Modal Logic
    btnGoAdmin.addEventListener('click', () => {
      passwordModal.classList.add('active');
      adminPasswordInput.focus();
    });

    btnCloseModal.addEventListener('click', () => {
      passwordModal.classList.remove('active');
      adminPasswordInput.value = '';
      passwordError.style.display = 'none';
    });

    btnCloseSuccessModal.addEventListener('click', () => {
      orderSuccessModal.classList.remove('active');
    });

    btnSubmitPassword.addEventListener('click', verifyPassword);
    adminPasswordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPassword();
    });

    async function verifyPassword() {
      const password = adminPasswordInput.value.trim();
      if (!password) return;
      
      btnSubmitPassword.disabled = true;
      btnSubmitPassword.innerHTML = '<span class="spinner"></span> 驗證中...';
      passwordError.style.display = 'none';

      try {
        let isOldScriptOrOffline = false;
        let resData = null;
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            mode: 'cors',
            body: JSON.stringify({
              action: 'verifyPassword',
              password: password
            })
          });

          if (response.ok) {
            resData = await response.json();
            if (resData && !resData.success && resData.error && resData.error.includes('密碼錯誤')) {
              isOldScriptOrOffline = false;
            } else if (resData && !resData.success) {
              isOldScriptOrOffline = true;
            }
          } else {
            isOldScriptOrOffline = true;
          }
        } catch (e) {
          isOldScriptOrOffline = true;
        }

        if (isOldScriptOrOffline) {
          // 降級處理：若是舊版 Apps Script (不支援 verifyPassword)，則比對混淆過的預設密碼
          if (btoa(password) === 'd2F0ZXI2MDM=') {
            sessionStorage.setItem('admin_password', password);
            window.location.href = 'admin.html';
            return;
          } else {
            throw new Error('密碼錯誤');
          }
        }

        if (resData && resData.success && resData.authenticated) {
          sessionStorage.setItem('admin_password', password);
          window.location.href = 'admin.html';
        } else {
          throw new Error(resData && resData.error ? resData.error : '密碼錯誤');
        }
      } catch (err) {
        console.error(err);
        passwordError.innerText = err.message.includes('密碼錯誤') ? '密碼錯誤，請再試一次' : '驗證失敗，請確認 API 設定或網路。';
        passwordError.style.display = 'block';
        adminPasswordInput.value = '';
        adminPasswordInput.focus();
      } finally {
        btnSubmitPassword.disabled = false;
        btnSubmitPassword.innerHTML = '登入';
      }
    }

    // Fetch Menu & Orders & Deadline
    async function fetchData(retry = 0) {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        menuData = data.menu || [];
        storesData = data.stores || [];
        ordersData = data.orders || [];
        activeStoreConfig = data.activeStore || null;
        
        // Handle Deadline
        if (data.deadline) {
          deadlineTime = new Date(data.deadline);
          startTimer();
        } else {
          deadlineTime = null;
          clearInterval(timerInterval);
          timerContainer.style.display = 'none';
        }

        renderStoreSelect();
        renderStats();
      } catch (err) {
        console.error('API 讀取錯誤:', err);
        if (retry < 1) {
          // 自動重試 1 次 (因應 Google Apps Script 冷啟動或連線瞬斷)
          setTimeout(() => fetchData(retry + 1), 1200);
        } else {
          showStatus('連線至 Google Sheets 失敗。若持續連線失敗，請檢查 Apps Script 是否已部署且權限為「所有人」。', 'error');
        }
      }
    }

    // Start countdown timer
    function startTimer() {
      clearInterval(timerInterval);
      timerContainer.style.display = 'flex';
      
      function updateTimer() {
        const now = new Date();
        const diff = deadlineTime - now;

        if (diff <= 0) {
          clearInterval(timerInterval);
          countdownEl.innerHTML = '點餐已截止';
          countdownEl.className = 'timer-countdown ended';
          timerStatusText.innerText = '點餐狀態：';
          disableOrdering(true);
        } else {
          disableOrdering(false);
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          
          countdownEl.innerHTML = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
          
          // Show alert if less than 15 mins (900,000 ms)
          if (diff < 15 * 60 * 1000) {
            countdownEl.className = 'timer-countdown danger';
            timerStatusText.innerText = '⚠️ 即將截止點餐：';
          } else {
            countdownEl.className = 'timer-countdown';
            timerStatusText.innerText = '🕒 點餐截止倒數：';
          }
        }
      }

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function disableOrdering(disabled) {
      if (disabled) {
        userDepartmentSelect.disabled = true;
        userNameInput.disabled = true;
        storeSelect.disabled = true;
        btnSubmit.disabled = true;
        btnSubmit.classList.add('btn-disabled');
        
        if (deadlineTime && (new Date() > deadlineTime)) {
          btnSubmit.innerHTML = '❌ 點餐已截止';
        } else if (!activeStoreConfig) {
          btnSubmit.innerHTML = '❌ 尚未指定點餐店家';
        } else {
          btnSubmit.innerHTML = '❌ 無法點餐';
        }
        
        // Disable checkboxes & qty buttons
        document.querySelectorAll('input[name="lunchbox-item"]').forEach(cb => {
          cb.disabled = true;
        });
        document.querySelectorAll('.qty-btn').forEach(btn => {
          btn.disabled = true;
          btn.style.opacity = 0.5;
          btn.style.pointerEvents = 'none';
        });
      } else {
        userDepartmentSelect.disabled = false;
        userNameInput.disabled = false;
        storeSelect.disabled = !!activeStoreConfig; // Keep disabled if locked by admin
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('btn-disabled');
        btnSubmit.innerHTML = '🚀 送出訂單';
        
        // Enable checkboxes & qty buttons
        document.querySelectorAll('input[name="lunchbox-item"]').forEach(cb => {
          cb.disabled = false;
        });
        document.querySelectorAll('.qty-btn').forEach(btn => {
          btn.disabled = false;
          btn.style.opacity = 1;
          btn.style.pointerEvents = 'auto';
        });
      }
    }

    // Populate Store Select
    function renderStoreSelect() {
      const stores = [...new Set(menuData.map(m => m.store))];
      const storeLabel = document.querySelector('label[for="store-select"]');
      
      if (stores.length === 0) {
        storeSelect.innerHTML = '<option value="" disabled selected>目前無可用的便當店</option>';
        menuItemsContainer.innerHTML = '<div class="empty-menu-placeholder">請聯絡管理員設定菜單</div>';
        return;
      }

      if (activeStoreConfig) {
        // Locked active store by admin
        storeLabel.innerHTML = '🏪 本次指定點餐店家 <span style="font-size: 0.75rem; color: var(--success); background: rgba(16,185,129,0.15); padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.25rem;">已鎖定</span>';
        storeSelect.innerHTML = `<option value="${activeStoreConfig}" selected>${activeStoreConfig}</option>`;
        storeSelect.disabled = true;
        renderMenuItems(activeStoreConfig);
        displayStoreDetails(activeStoreConfig);
        
        // Enable controls if within deadline
        if (!deadlineTime || (new Date() <= deadlineTime)) {
          disableOrdering(false);
        }
      } else {
        // No active store designated yet
        storeLabel.innerHTML = '🏪 選擇便當店 <span style="font-size: 0.75rem; color: var(--warning); background: rgba(245,158,11,0.15); padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.25rem;">等待指定</span>';
        storeSelect.innerHTML = '<option value="" disabled selected>⚠️ 請等待管理者指定本次點餐店家</option>';
        storeSelect.disabled = true;
        document.getElementById('store-info-display').style.display = 'none';
        menuItemsContainer.innerHTML = '<div class="empty-menu-placeholder">請等待管理員設定本次點餐店家</div>';
        disableOrdering(true);
      }
    }

    // Render Menu Checkboxes for selected store
    storeSelect.addEventListener('change', (e) => {
      renderMenuItems(e.target.value);
    });

    function renderMenuItems(storeName) {
      menuItemsContainer.innerHTML = '';
      const items = menuData.filter(m => m.store === storeName);
      const searchWrapper = document.getElementById('menu-search-wrapper');
      const searchInput = document.getElementById('menu-search-input');

      if (items.length === 0) {
        if (searchWrapper) searchWrapper.style.display = 'none';
        menuItemsContainer.innerHTML = '<div class="empty-menu-placeholder">此店家無品項</div>';
        return;
      }

      if (searchWrapper) {
        searchWrapper.style.display = 'block';
        if (searchInput) searchInput.value = '';
      }

      // Calculate popularity from ordersData for this store
      const storeItemCounts = {};
      ordersData.filter(o => o.store === storeName).forEach(o => {
        const qty = o.quantity ? parseInt(o.quantity) || 1 : 1;
        storeItemCounts[o.item] = (storeItemCounts[o.item] || 0) + qty;
      });

      // Get distinct order counts in descending order (only > 0)
      const distinctCounts = [...new Set(Object.values(storeItemCounts).filter(c => c > 0))].sort((a, b) => b - a);

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'menu-item-selection-row';
        row.setAttribute('data-item-name', item.item);
        
        let hotBadge = '';
        const orderCount = storeItemCounts[item.item] || 0;
        if (orderCount > 0 && distinctCounts.length > 0) {
          if (orderCount === distinctCounts[0]) {
            hotBadge = `<span style="background: linear-gradient(135deg, #ef4444, #f97316); color: #ffffff; font-size: 0.68rem; padding: 0.12rem 0.45rem; border-radius: 4px; font-weight: 700; margin-left: 0.4rem; box-shadow: 0 2px 4px rgba(239,68,68,0.3);">🔥 熱銷 NO.1</span>`;
          } else if (distinctCounts.length >= 2 && orderCount === distinctCounts[1]) {
            hotBadge = `<span style="background: linear-gradient(135deg, #3b82f6, #6366f1); color: #ffffff; font-size: 0.68rem; padding: 0.12rem 0.45rem; border-radius: 4px; font-weight: 700; margin-left: 0.4rem; box-shadow: 0 2px 4px rgba(59,130,246,0.3);">🥈 熱銷 NO.2</span>`;
          } else if (distinctCounts.length >= 3 && orderCount === distinctCounts[2]) {
            hotBadge = `<span style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; font-size: 0.68rem; padding: 0.12rem 0.45rem; border-radius: 4px; font-weight: 700; margin-left: 0.4rem; box-shadow: 0 2px 4px rgba(245,158,11,0.3);">🥉 熱銷 NO.3</span>`;
          }
        }

        row.innerHTML = `
          <label class="checkbox-container">
            <span class="item-name">${escapeHtml(item.item)}${hotBadge}</span>
            <span class="item-price">$${item.price}</span>
            <input type="checkbox" name="lunchbox-item" value="${escapeHtml(item.item)}" data-price="${item.price}">
            <span class="checkmark"></span>
          </label>
          <div class="quantity-selector" style="display: none;">
            <button type="button" class="qty-btn qty-minus">-</button>
            <input type="number" class="qty-input" value="1" min="1" readonly>
            <button type="button" class="qty-btn qty-plus">+</button>
          </div>
        `;
        menuItemsContainer.appendChild(row);

        const checkbox = row.querySelector('input[type="checkbox"]');
        const qtySelector = row.querySelector('.quantity-selector');
        const qtyInput = row.querySelector('.qty-input');
        const btnMinus = row.querySelector('.qty-minus');
        const btnPlus = row.querySelector('.qty-plus');

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            qtySelector.style.display = 'flex';
          } else {
            qtySelector.style.display = 'none';
            qtyInput.value = 1;
          }
          updateSubtotal();
        });

        btnMinus.addEventListener('click', () => {
          let val = parseInt(qtyInput.value) || 1;
          if (val > 1) {
            qtyInput.value = val - 1;
            updateSubtotal();
          }
        });

        btnPlus.addEventListener('click', () => {
          let val = parseInt(qtyInput.value) || 1;
          qtyInput.value = val + 1;
          updateSubtotal();
        });
      });

      // If deadline already passed, make sure newly rendered checkboxes are disabled
      if (deadlineTime && (new Date() > deadlineTime)) {
        document.querySelectorAll('input[name="lunchbox-item"]').forEach(cb => {
          cb.disabled = true;
        });
        document.querySelectorAll('.qty-btn').forEach(btn => {
          btn.disabled = true;
          btn.style.opacity = 0.5;
          btn.style.pointerEvents = 'none';
        });
      }
      
      updateSubtotal();
    }

    // Real-time Menu Item Keyword Search Filter
    const menuSearchInput = document.getElementById('menu-search-input');
    if (menuSearchInput) {
      menuSearchInput.addEventListener('input', () => {
        const query = menuSearchInput.value.trim().toLowerCase();
        let visibleCount = 0;

        document.querySelectorAll('#menu-items-container .menu-item-selection-row').forEach(row => {
          const itemName = row.getAttribute('data-item-name') || '';
          if (!query || itemName.toLowerCase().includes(query)) {
            row.style.display = 'flex';
            visibleCount++;
          } else {
            row.style.display = 'none';
          }
        });

        let noMatchEl = document.getElementById('search-no-match-placeholder');
        if (visibleCount === 0) {
          if (!noMatchEl) {
            noMatchEl = document.createElement('div');
            noMatchEl.id = 'search-no-match-placeholder';
            noMatchEl.className = 'empty-menu-placeholder';
            document.getElementById('menu-items-container').appendChild(noMatchEl);
          }
          noMatchEl.innerText = `🔍 找不到符合「${query}」的便當品項`;
          noMatchEl.style.display = 'block';
        } else if (noMatchEl) {
          noMatchEl.style.display = 'none';
        }
      });
    }

    let isSubmitting = false;

    function resetSubmitBtn() {
      isSubmitting = false;
      if (!deadlineTime || (new Date() <= deadlineTime)) {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('btn-disabled');
        btnSubmit.style.pointerEvents = 'auto';
        btnSubmit.innerHTML = '🚀 送出訂單';
      }
    }

    // Submit Order
    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // 1. 防連按防護：若正處於傳送/處理中，直接攔截不重複發送
      if (isSubmitting) return;
      isSubmitting = true;
      
      // 2. 立即禁用按鈕與點擊事件，並顯示載入中動畫
      btnSubmit.disabled = true;
      btnSubmit.classList.add('btn-disabled');
      btnSubmit.style.pointerEvents = 'none';
      btnSubmit.innerHTML = '<span class="spinner"></span> 處理中...';

      const department = userDepartmentSelect.value;
      const name = userNameInput.value.trim();
      const store = storeSelect.value;
      
      if (!department) {
        showStatus('請選擇您的單位', 'error');
        resetSubmitBtn();
        return;
      }
      if (!name) {
        showStatus('請輸入您的姓名', 'error');
        resetSubmitBtn();
        return;
      }
      if (!store) {
        showStatus('請選擇便當店', 'error');
        resetSubmitBtn();
        return;
      }

      // 檢查是否與已有訂單重複
      const existingOrder = getExistingOrderForUser(name);
      if (existingOrder && !isConfirmedOverwrite) {
        overwriteModalDesc.innerText = `您（${name}）先前在 ${store} 已有點餐紀錄（已點：${existingOrder.summaryText}）。`;
        overwriteConfirmModal.classList.add('active');
        resetSubmitBtn();
        return;
      }

      const checkedItems = [];
      document.querySelectorAll('.menu-item-selection-row').forEach(row => {
        const cb = row.querySelector('input[name="lunchbox-item"]');
        if (cb && cb.checked) {
          const qtyInput = row.querySelector('.qty-input');
          const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;
          const price = parseFloat(cb.getAttribute('data-price')) || 0;
          
          for (let i = 0; i < qty; i++) {
            checkedItems.push({
              item: cb.value,
              price: price,
              quantity: 1
            });
          }
        }
      });

      if (checkedItems.length === 0) {
        showStatus('請至少勾選一項便當品項！', 'error');
        resetSubmitBtn();
        return;
      }

      if (deadlineTime && (new Date() > deadlineTime)) {
        showStatus('抱歉，已過截止時間，無法送出訂單。', 'error');
        resetSubmitBtn();
        return;
      }

      btnSubmit.innerHTML = '<span class="spinner"></span> 送出中...';
      showStatus('正在傳送訂單至 Google Sheet...', 'info');

      try {
        const payload = {
          action: 'submitOrder',
          department: department,
          name: name,
          store: store,
          items: checkedItems,
          overwrite: !!existingOrder
        };

        const response = await fetch(apiUrl, {
          method: 'POST',
          mode: 'cors',
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('伺服器回應錯誤');
        const resData = await response.json();
        
        if (resData.success) {
          // Save user name and department to localStorage for next time
          localStorage.setItem('lunchbox_user_name', name);
          localStorage.setItem('lunchbox_user_dept', department);

          showStatus('🎉 訂單送出成功！已寫入試算表。', 'success');
          isConfirmedOverwrite = false;
          userDepartmentSelect.value = department;
          userNameInput.value = name;
          checkDuplicateUserOrder();
          document.querySelectorAll('input[name="lunchbox-item"]:checked').forEach(cb => {
            cb.checked = false;
          });
          document.querySelectorAll('.quantity-selector').forEach(sel => {
            sel.style.display = 'none';
          });
          document.querySelectorAll('.qty-input').forEach(inp => {
            inp.value = 1;
          });
          updateSubtotal();
          await fetchData();
          orderSuccessModal.classList.add('active');
        } else {
          throw new Error(resData.error || '不明錯誤');
        }
      } catch (err) {
        console.error(err);
        showStatus(`送出訂單失敗: ${err.message}`, 'error');
      } finally {
        resetSubmitBtn();
      }
    });

    // Render Stats Dashboard & Detailed List
    function renderStats() {
      // 1. Calculate count for each item
      const itemCounts = {};
      
      // Filter orders to only match the currently active store config
      const filteredOrders = ordersData.filter(ord => ord.store === activeStoreConfig);
      
      filteredOrders.forEach(ord => {
        const key = ord.item;
        if (!itemCounts[key]) {
          itemCounts[key] = {
            store: ord.store,
            item: ord.item,
            count: 0
          };
        }
        const qty = ord.quantity ? parseInt(ord.quantity) || 1 : 1;
        itemCounts[key].count += qty;
      });

      // Populate Stats Cards Grid
      statsSummary.innerHTML = '';
      const statItems = Object.values(itemCounts).sort((a, b) => b.count - a.count);
      
      if (statItems.length === 0) {
        statsSummary.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 1rem 0;">目前此店家尚無人點餐，快當第一個吧！</div>';
      } else {
        statItems.forEach(item => {
          const box = document.createElement('div');
          box.className = 'stat-box';
          
          box.innerHTML = `
            <div class="stat-label" title="${item.item}">${item.item}</div>
            <div class="stat-num">${item.count} <span style="font-size: 1rem; color: var(--text-secondary)">份</span></div>
          `;
          statsSummary.appendChild(box);
        });
      }

      // 2. Populate detailed list table
      ordersListBody.innerHTML = '';
      if (filteredOrders.length === 0) {
        ordersListBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">目前無此店家的點餐資料</td></tr>';
        return;
      }

      // Group/consolidate identical items in the same order (same name, same item, same timestamp or within 5s)
      const consolidatedOrders = [];
      filteredOrders.forEach(ord => {
        const qty = ord.quantity ? parseInt(ord.quantity) || 1 : 1;
        const price = parseFloat(ord.price) || 0;

        const match = consolidatedOrders.find(c => 
          c.department === ord.department &&
          c.name === ord.name &&
          c.store === ord.store &&
          c.item === ord.item &&
          (new Date(c.timestamp).getTime() - new Date(ord.timestamp).getTime() === 0 ||
           Math.abs(new Date(c.timestamp).getTime() - new Date(ord.timestamp).getTime()) < 5000)
        );

        if (match) {
          match.quantity += qty;
          match.totalPrice += (price * qty);
        } else {
          consolidatedOrders.push({
            ...ord,
            quantity: qty,
            totalPrice: price * qty
          });
        }
      });

      // Sort orders by Bento Item (品項) primary, then Person Name (姓名) secondary for easy bento distribution
      const sortedOrders = [...consolidatedOrders].sort((a, b) => {
        const itemComp = (a.item || '').localeCompare(b.item || '', 'zh-Hant');
        if (itemComp !== 0) return itemComp;
        return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
      });
      
      sortedOrders.forEach(ord => {
        const tr = document.createElement('tr');
        
        let dateStr = '未知';
        if (ord.timestamp) {
          const d = new Date(ord.timestamp);
          dateStr = `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        let displayItem = escapeHtml(ord.item);
        if (ord.quantity > 1) {
          displayItem += ` <span style="background: rgba(2, 132, 199, 0.08); color: #0284c7; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-left: 0.25rem;">x${ord.quantity}</span>`;
        }

        tr.innerHTML = `
          <td><span style="background: rgba(14, 165, 233, 0.05); color: #0284c7; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem;">${escapeHtml(ord.department || '無')}</span></td>
          <td style="font-weight: 500;">${escapeHtml(ord.name)}</td>
          <td>${displayItem}</td>
          <td style="color: var(--text-secondary); font-weight: 500;">$${ord.totalPrice}</td>
          <td style="font-size: 0.8rem; color: var(--text-muted);">${dateStr}</td>
        `;
        ordersListBody.appendChild(tr);
      });
    }

    function displayStoreDetails(storeName) {
      const displayEl = document.getElementById('store-info-display');
      const storeInfo = storesData.find(s => s.store === storeName);
      
      if (!storeInfo) {
        displayEl.style.display = 'none';
        return;
      }
      
      let html = '';
      if (storeInfo.address && storeInfo.address.trim()) {
        html += `<div style="margin-bottom: 0.25rem;"><strong>📍 店家地址：</strong>${escapeHtml(storeInfo.address)}</div>`;
      }
      if (storeInfo.phone && storeInfo.phone.trim()) {
        html += `<div style="margin-bottom: 0.25rem;"><strong>📞 店家電話：</strong>${escapeHtml(storeInfo.phone)}</div>`;
      }
      if (storeInfo.remarks && storeInfo.remarks.trim()) {
        html += `<div><strong>📝 備註事項：</strong>${escapeHtml(storeInfo.remarks)}</div>`;
      }
      
      if (html) {
        displayEl.innerHTML = html;
        displayEl.style.display = 'block';
      } else {
        displayEl.style.display = 'none';
      }
    }

    // Helper functions
    function showStatus(msg, type) {
      submitStatus.innerText = msg;
      submitStatus.className = `status-msg ${type}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
